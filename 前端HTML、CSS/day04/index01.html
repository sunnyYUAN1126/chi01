<plate for="apple">
for就是[屬性]
[for] =>有for屬性的所有人
[for="abc"] =>for值等於"abc"
[for^="a"] =>for值的開頭字串為"a"
[for$="c"] =>for值以"c"結尾
[for*="b"] =>for值包含"b"字串
 -->

<!-- 
 ericReset normalize差異
https://israynotarray.com/css/20210807/3641451940/ 

Reset CSS
優點 - 所有預設樣式統一，盡可能統一所有樣式初始化
缺點 - 每一個標籤都必須重新寫樣式，你也必須先知道有哪些標籤被清空了

Normalize
優點 - 保留預設樣式，減少重新撰寫樣式的美送。
缺點 - 有非常低的機率發生樣式不統一，但這個機會已經很少了。
-->
