<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class</title>
</head>
<body>
    <!-- id是#字號，class是.點，命名不可以亂取 -->
     <!-- 命名:
     user_name 蛇式
     user_name (小)駝峰式
     UserName (大)駝峰式
     user-name 烤肉串
     模組化 複合式 ex:card__img__active -->

    <h1 id="id_name" class="color_rad size_100" >CSS</h1>

    <!-- .className -->
    <div class="className"></div>

    <!-- p.className#idName -->
    <p class="calssName" id="idName"></p>
    <!-- p一定要在前面 -->
   
    <!-- p#idname.className.className2 -->
    <p id="idname" class="className className2"></p>

    <!-- ul>li#id_$*3 -->
    <ul>
        <li id="id_1"></li>
        <li id="id_2"></li>
        <li id="id_3"></li>
    </ul>
    
    <!-- ul>li#id_$.list_item*3 -->
    <!-- alt+方向鍵:整行移動位置 -->
    <ul>
        <li id="id_1" class="list_item"></li>
        <li id="id_2" class="list_item"></li>
        <li id="id_3" class="list_item"></li>
    </ul>

</body>
</html>
