<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVA01</title>
</head>
<body>
<!-- VScode安裝live server  -->


<!-- 大標題區塊 -->
    <h1>Hi父
      <span>123子</span>
    </h1>
    <h2>2</h2>
    <!-- 大標題區塊結束 -->
    
    <!-- img是單標籤 -->
    <img scr="" alt="">
    
    <br />

    <!-- 註解內容 快速鍵: ctrl加斜線(/) -->
    

<!-- 標題標籤  -->
    <h1>h1 大標</h1>
    <h2>h2</h2>
    <h3>h3</h3>
    <h4>h4</h4>
    <h5>h5</h5>
    <h6>h6</h6>
<!-- ctrl shift p >wra 程式碼螢幕換行-->

<!-- 內文 -->
    <p>
    <!-- 強調標籤 -->

        <!-- strong:語意話、強調、粗體 -->
        <!-- b:舊式粗體、樣式修改 -->
        <!-- em:斜體、修飾 -->
        <!-- i:斜體、修飾 -->
        <strong>Lorem ipsum dolor</strong>,
        <b>sit amet consectetur</b>,
        <em>Nisi adipisicing elit </em> ,
        <i>Nisi optio magni</i> ,
    <!-- 換行 -->
        <br>  
        ea assumenda sequi fugiat amet sit unde eum voluptatem aperiam provident 
        quisquam ullam placeat, dolore consequatur 
        culpa fuga vero.
    </p>

<!-- 引用標籤 -->
    <!-- <cite="">中cite是屬性，放網址，作為引用註解 -->
    <blockquote cite="https://new.ntpu.edu.tw/">
        引用的文章內容
    </blockquote>
    <q cite="">引用的句子</q>

<!-- 影片標籤 -->
     <!-- 功能:影片自動撥放與控制條、影片循環撥放loop、影片初始圖案poster -->
    <video width="200" src="https://cdn.pixabay.com/video/2025/08/20/298643_large.mp4" controls autoplays muted loop poster="https://cdn.pixabay.com/photo/2017/03/28/04/13/cat-2180975_1280.jpg"></video>

    <!-- 差異
         mp4 :
         WabM :
          -->
    
    

</body>

</html>
