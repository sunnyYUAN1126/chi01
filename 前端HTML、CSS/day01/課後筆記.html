粗體字
用 <b></b> 這個標籤，就是僅僅代表著讓這個字串看起來粗粗的(視覺上的意義)。 而 <strong></strong> 則有實際上的語意，被 Strong 標示過的字串，表示這是很重要的字串，我得要用一個粗體的樣式來提醒大家(語意上的意義)。

斜體字
視覺層次的標籤，就是 <i></i>。 而 <em></em> 則是代表這是重要的字串(或名詞)，幫我打成斜體來提醒讀者，因為這是我要強調的內容。
